<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MudTexture Explore</title>
<style>
  :root { --paper: #f4ecd6; --paper-2: #ebe2c8; --ink: #221e1a; --ink-2: #6a6158; --line: #cfc4a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ffffff; color: var(--ink); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--paper); border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; }
  h1 { font-size: 15px; margin: 0; }
  label { color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  select, button { font: inherit; padding: 5px 10px; border: 1px solid var(--ink); background: #fffaf0; color: var(--ink); border-radius: 5px; cursor: pointer; }
  select { border-color: var(--line); }
  button:hover { background: var(--paper-2); }
  input[type=range] { accent-color: var(--ink); width: 120px; }
  a { color: var(--ink); }
  .hint { color: var(--ink-2); margin-left: auto; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; padding: 18px 16px 60px; }
  .cell { text-align: center; }
  .cell canvas { width: 150px; height: 150px; display: block; margin: 0 auto; cursor: pointer; border-radius: 50%; }
  .cell.kept canvas { outline: 2px solid var(--ink); outline-offset: 4px; }
  .cell .meta { color: var(--ink-2); font-size: 11.5px; margin-top: 6px; min-height: 30px; }
  .cell .acts { display: flex; justify-content: center; gap: 4px; margin-top: 4px; opacity: 0; transition: opacity .15s; }
  .cell:hover .acts, .cell.kept .acts { opacity: 1; }
  .cell .acts button { padding: 2px 7px; font-size: 11.5px; }
  @media (hover: none) { .cell .acts { opacity: 1; } }
</style>
</head>
<body>
<header>
  <h1>MudTexture Explore</h1>
  <label>Mode
    <select id="mode">
      <option value="random">Random</option>
      <option value="mutate">Mutate base</option>
      <option value="seeds">Seeds of base</option>
    </select>
  </label>
  <label>Base <select id="base"></select></label>
  <label>Polish <input id="polish" type="range" min="0" max="1" step="0.05" value="1"></label>
  <label>Count
    <select id="count"><option>12</option><option selected>24</option><option>48</option></select>
  </label>
  <button id="roll">Roll (Space)</button>
  <a href="index.html">Maker</a> <a href="lab.html">Lab</a>
  <span class="hint">Click a ball to keep it. Kept balls stay when you roll.</span>
</header>
<div id="grid"></div>

<script src="core/texcore.js"></script>
<script src="library.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const lib = window.TEX_LIBRARY || {};
  const T = window.TexCore;

  // Parameter ranges (same as the maker's sliders).
  const PARAMS = {
    fill: [],
    clouds: [["scale", 0.8, 8], ["threshold", 0.3, 0.7], ["softness", 0.1, 0.9], ["octaves", 1, 5, true]],
    ribbons: [["scale", 2, 14], ["warp", 0.2, 2.2], ["width", 0.2, 1], ["twist", 0, 6]],
    veins: [["scale", 2, 12], ["warp", 0.2, 2.2], ["sharpness", 4, 30]],
    speckle: [["scale", 25, 140], ["density", 0.03, 0.35]],
    earth: [["scale", 1, 6], ["detail", 2, 6, true]],
    kintsugi: [["cells", 1.5, 6], ["crack", 0.015, 0.1], ["jitter", 0, 1]],
    agate: [["rings", 4, 30], ["warp", 0.2, 2]],
    marble: [["scale", 0.8, 5], ["sharp", 1.5, 6]],
    strata: [["layers", 3, 20, true], ["bend", 0, 1.5]],
    galaxy: [["scale", 1, 5], ["stars", 0.003, 0.03]],
  };
  const PATTERNS = ["clouds", "ribbons", "veins", "speckle"];
  const GENERATORS = ["earth", "kintsugi", "agate", "marble", "strata", "galaxy"];

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const r2 = (x) => Math.round(x * 100) / 100;
  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360; s = clamp(s, 0, 1); l = clamp(l, 0, 1);
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const hex = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
    return "#" + hex(f(0)) + hex(f(8)) + hex(f(4));
  }
  function toHsl(hex) {
    const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    if (max === min) return [0, 0, l];
    const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    let h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }

  function randomParams(type, layer) {
    for (const [name, lo, hi, int] of PARAMS[type]) layer[name] = int ? Math.round(rand(lo, hi)) : r2(rand(lo, hi));
  }

  // A whole random definition: a base colour, 1-3 pattern layers in a related palette.
  function randomDef(n) {
    const hue = rand(0, 360);
    const earthy = Math.random() < 0.6;
    const sat = earthy ? rand(0.15, 0.55) : rand(0.3, 0.85);
    const light = rand(0.12, 0.85);
    let layers;
    if (Math.random() < 0.5) {
      // Generator base: it paints its own colours.
      const type = pick(GENERATORS);
      const g = { type,
        color: hsl(hue, sat, clamp(light - 0.25, 0.04, 0.9)),
        color2: hsl(hue + rand(-30, 30) + (Math.random() < 0.3 ? 180 : 0), clamp(sat + rand(-0.2, 0.2), 0, 1), clamp(light + 0.15, 0.1, 0.95)),
        color3: type === "kintsugi" ? hsl(rand(35, 50), rand(0.6, 0.85), rand(0.5, 0.65)) : type === "galaxy" ? "#ffffff" : hsl(hue + rand(-20, 20), sat, clamp(light + 0.35, 0.2, 0.97)) };
      randomParams(type, g);
      layers = [g];
    } else {
      layers = [{ type: "fill", color: hsl(hue, sat, light) }];
      if (Math.random() < 0.4) layers[0].accent = hsl(hue + rand(-25, 25), sat, clamp(light + rand(-0.15, 0.15), 0.05, 0.95));
    }
    const count = (layers[0].type === "fill" ? 1 : 0) + Math.floor(Math.random() * (layers[0].type === "fill" ? 3 : 2));
    for (let i = 0; i < count; i++) {
      const type = pick(PATTERNS);
      const shift = Math.random() < 0.25 ? rand(120, 240) : rand(-40, 40); // sometimes a contrasting colour
      const layer = { type, color: hsl(hue + shift, clamp(sat + rand(-0.2, 0.2), 0, 1), clamp(light + rand(-0.45, 0.45), 0.03, 0.97)), amount: r2(rand(0.25, 0.85)) };
      randomParams(type, layer);
      if ((type === "veins" || type === "speckle") && Math.random() < 0.12) layer.glow = r2(rand(0.5, 1));
      if (type === "speckle" && Math.random() < 0.25) { layer.metalness = r2(rand(0.5, 1)); layer.roughness = r2(rand(0.02, 0.15)); }
      if (Math.random() < 0.25) { layer.accent = hsl(hue + rand(-60, 60), sat, light); layer.accentScale = r2(rand(1, 4)); }
      layers.push(layer);
    }
    return {
      id: "explore" + n, name: "Explore " + n, version: 1,
      rough: { roughness: r2(rand(0.8, 0.95)) },
      polished: { roughness: r2(rand(0.03, 0.3)), metalness: r2(Math.random() < 0.7 ? rand(0, 0.08) : rand(0.1, 0.4)) },
      layers,
    };
  }

  // A variation of a base definition: jitter numbers and colours, sometimes swap or add a layer.
  function mutate(base, n) {
    const d = JSON.parse(JSON.stringify(base));
    d.id = (base.id || "base") + "_v" + n; d.name = (base.name || base.id) + " v" + n;
    for (const layer of d.layers) {
      if (Math.random() < 0.12 && PATTERNS.includes(layer.type)) { layer.type = pick(PATTERNS); randomParams(layer.type, layer); }
      for (const [name, lo, hi, int] of PARAMS[layer.type] || []) {
        const cur = typeof layer[name] === "number" ? layer[name] : (lo + hi) / 2;
        const v = clamp(cur + (hi - lo) * rand(-0.15, 0.15), lo, hi);
        layer[name] = int ? Math.round(v) : r2(v);
      }
      const isBase = layer === d.layers[0] && (layer.type === "fill" || GENERATORS.includes(layer.type));
      if (!isBase) layer.amount = r2(clamp((layer.amount ?? 1) + rand(-0.15, 0.15), 0.1, 1));
      for (const key of ["color", "accent", "color2", "color3"]) {
        if (!layer[key]) continue;
        const [h, s, l] = toHsl(layer[key]);
        layer[key] = hsl(h + rand(-14, 14), s + rand(-0.08, 0.08), l + rand(-0.07, 0.07));
      }
    }
    if (Math.random() < 0.2 && d.layers.length < 5) {
      const type = pick(PATTERNS), src = d.layers[d.layers.length - 1];
      const layer = { type, color: src.color, amount: r2(rand(0.2, 0.6)) };
      randomParams(type, layer); d.layers.push(layer);
    }
    d.polished.roughness = r2(clamp(d.polished.roughness + rand(-0.04, 0.04), 0.02, 0.5));
    return d;
  }

  // ---------- drawing a lit ball on a 2-D canvas ----------
  const L = norm([-0.45, 0.6, 0.65]); // light from upper left, toward viewer
  function norm(v) { const m = Math.hypot(v[0], v[1], v[2]); return [v[0] / m, v[1] / m, v[2] / m]; }
  function drawBall(canvas, def, seed, polish) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const size = Math.round(150 * dpr);
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext("2d");
    const img = ctx.createImageData(size, size);
    const stack = [{ def, amount: 1, polish }];
    const H = norm([L[0], L[1], L[2] + 1]);
    const yaw = 0.6;
    for (let py = 0; py < size; py++) {
      for (let px = 0; px < size; px++) {
        const x = (px + 0.5) / size * 2 - 1, y = 1 - (py + 0.5) / size * 2;
        const rr = x * x + y * y;
        if (rr > 1) continue;
        const z = Math.sqrt(1 - rr);
        // Turn the ball a little so the poles aren't facing us.
        const nx = x * Math.cos(yaw) + z * Math.sin(yaw), nz = -x * Math.sin(yaw) + z * Math.cos(yaw);
        const u = (Math.atan2(nz, nx) / (Math.PI * 2) + 1) % 1, v = Math.acos(clamp(y, -1, 1)) / Math.PI;
        const m = T.sampleStack(stack, seed, u, v);
        const ndl = Math.max(0, x * L[0] + y * L[1] + z * L[2]);
        const ndh = Math.max(0, x * H[0] + y * H[1] + z * H[2]);
        const rough = m.roughness, metal = m.metalness;
        const shin = clamp(2 / Math.max(rough ** 4, 1e-4) - 2, 1, 4000);
        const spec = Math.pow(ndh, shin) * (1 - rough) * 1.6;
        const fres = Math.pow(1 - z, 3) * (1 - rough) * 0.55;
        const base = [m.r, m.g, m.b];
        const out = [0, 0, 0];
        for (let i = 0; i < 3; i++) {
          const diffuse = base[i] * (0.32 + 0.78 * ndl) * (1 - metal * 0.7);
          const specCol = (1 - metal) * 1 + metal * base[i];
          out[i] = diffuse + spec * specCol + fres * (0.9 + 0.1 * base[i]) + m.glow * base[i] * 0.9;
        }
        const o = (py * size + px) * 4;
        const edge = clamp((1 - Math.sqrt(rr)) * size * 0.5, 0, 1); // soft antialiased rim
        img.data[o] = clamp(out[0], 0, 1) * 255; img.data[o + 1] = clamp(out[1], 0, 1) * 255; img.data[o + 2] = clamp(out[2], 0, 1) * 255;
        img.data[o + 3] = 255 * edge;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // ---------- grid ----------
  const grid = $("grid");
  let cells = []; // { def, seed, kept, el, canvas, meta }
  let counter = 1;
  for (const id of Object.keys(lib).sort()) $("base").add(new Option((lib[id].name || id) + " · " + id, id));
  if (lib.loam) $("base").value = "loam";

  function summary(def) {
    return def.layers.map((l) => l.type + (l.glow ? "*" : "")).join(" · ");
  }
  function download(name, text) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" })); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function json(def) {
    return JSON.stringify({ id: def.id, name: def.name, version: 1, rough: def.rough, polished: def.polished, layers: def.layers }, null, 2) + "\n";
  }
  function addBase(def) {
    const id = def.id;
    lib[id] = JSON.parse(JSON.stringify(def));
    if (![...$("base").options].some((o) => o.value === id)) $("base").add(new Option(def.name + " · " + id, id));
    $("base").value = id;
  }

  function makeCell(c) {
    const el = document.createElement("div"); el.className = "cell" + (c.kept ? " kept" : "");
    const canvas = document.createElement("canvas");
    const meta = document.createElement("div"); meta.className = "meta";
    const acts = document.createElement("div"); acts.className = "acts";
    const bSave = Object.assign(document.createElement("button"), { textContent: "JSON", title: "Download this definition" });
    const bBase = Object.assign(document.createElement("button"), { textContent: "Base", title: "Use as the base for Mutate / Seeds" });
    const bOpen = Object.assign(document.createElement("button"), { textContent: "Edit", title: "Open in the maker" });
    bSave.onclick = () => download(c.def.id + ".json", json(c.def));
    bBase.onclick = () => { addBase(c.def); $("mode").value = "mutate"; };
    bOpen.onclick = () => {
      try { localStorage.setItem("mudtexture.open", JSON.stringify({ def: c.def, seed: c.seed })); } catch (e) {}
      location.href = "index.html";
    };
    canvas.onclick = () => { c.kept = !c.kept; el.classList.toggle("kept", c.kept); };
    acts.append(bSave, bBase, bOpen);
    el.append(canvas, meta, acts);
    c.el = el; c.canvas = canvas; c.meta = meta;
    meta.textContent = summary(c.def) + "\nseed " + c.seed;
    meta.style.whiteSpace = "pre-line";
    return el;
  }

  let job = 0;
  function roll() {
    const n = +$("count").value, mode = $("mode").value, base = lib[$("base").value];
    const kept = cells.filter((c) => c.kept);
    const next = kept.slice(0, n);
    while (next.length < n) {
      const seed = Math.floor(Math.random() * 2147483646) + 1;
      let def;
      if (mode === "random" || !base) def = randomDef(counter++);
      else if (mode === "mutate") def = mutate(base, counter++);
      else def = base;
      next.push({ def, seed, kept: false });
    }
    cells = next;
    grid.innerHTML = "";
    for (const c of cells) grid.append(makeCell(c));
    // Draw one ball per frame so the page stays responsive.
    const my = ++job, polish = +$("polish").value;
    let i = 0;
    (function step() {
      if (my !== job || i >= cells.length) return;
      drawBall(cells[i].canvas, cells[i].def, cells[i].seed, polish);
      i++;
      requestAnimationFrame(step);
    })();
  }
  function redraw() {
    const my = ++job, polish = +$("polish").value;
    let i = 0;
    (function step() {
      if (my !== job || i >= cells.length) return;
      drawBall(cells[i].canvas, cells[i].def, cells[i].seed, polish);
      i++;
      requestAnimationFrame(step);
    })();
  }

  $("roll").onclick = roll;
  $("polish").onchange = redraw;
  $("count").onchange = roll;
  $("mode").onchange = roll;
  $("base").onchange = () => { if ($("mode").value !== "random") roll(); };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target.tagName !== "SELECT" && e.target.tagName !== "INPUT") { e.preventDefault(); roll(); }
  });
  roll();
})();
</script>
</body>
</html>
